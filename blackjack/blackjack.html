<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./blackjack.css">
    <title>BlackJack</title>
</head>
<body>
    <div class="game">
        <h1>Blackjack</h1>
        <p class="game-p" id="message-el">Want to play a round?</p>
        <p class="game-p" id="cards-el">Cards:</p>
        <p class="game-p" id="sum-el">Sum:</p> 
        <button class="start-game" onclick="startGame()">New Game</button>
        <button class="new-card" onclick="newCard()">New Card</button>
        <p id="player-el"></p>
    </div>
    <script src="blackjack.js"></script>
</body>
</html>
