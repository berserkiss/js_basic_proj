<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Karla:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="generator.css">
    <title>Document</title>
</head>
<body>
   <div class="container">
       <div class="pass-cont">
            <h1 class="header"><span>Generate</span> a random password</h1>
            <h2 class="sub-header">Never use an unsecure password again</h2>
            <button class="generator-button" onclick="StartGenerating()">Generate a password</button>
            <form class="password-collector" action="#" method="post">
                <input type="text" placeholder=". . . . ." class="generated-pass" id="pas-1">
                <input type="text" placeholder=". . . . ." class="generated-pass" id="pas-2" >
                <input type="text" placeholder=". . . . ." class="generated-pass" id="pas-3" >
                <input type="text" placeholder=". . . . ." class="generated-pass" id="pas-4" >
            </form>
       </div>
   </div>
   <script src="generator.js"></script>
</body>
</html>
